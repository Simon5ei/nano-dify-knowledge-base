<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nano Dify · 知识库</title>
  <link rel="stylesheet" href="/static/style.css?v=0.2.0" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏：知识库列表 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">📚</span>
        <span class="brand-name">Nano Dify 知识库</span>
      </div>
      <button class="btn btn-primary btn-block" id="btnNewDataset">+ 新建知识库</button>
      <div class="dataset-list" id="datasetList"></div>
    </aside>

    <!-- 主区域 -->
    <main class="main" id="mainArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🗂️</div>
        <p>选择左侧知识库，或新建一个开始</p>
      </div>

      <div class="dataset-view hidden" id="datasetView">
        <header class="dataset-header">
          <div>
            <h1 id="dsName"></h1>
            <p class="muted" id="dsDesc"></p>
          </div>
          <div class="tabs">
            <button class="tab active" data-tab="docs">文档</button>
            <button class="tab" data-tab="hit">召回测试</button>
            <button class="tab" data-tab="settings">设置</button>
          </div>
        </header>

        <!-- 文档页 -->
        <section class="tab-panel" id="panel-docs">
          <div class="toolbar">
            <span class="muted" id="docStats"></span>
            <button class="btn btn-primary" id="btnUpload">⬆ 上传文档</button>
            <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf,.docx" hidden />
          </div>
          <table class="table">
            <thead>
              <tr><th>名称</th><th>大小</th><th>分段数</th><th>状态</th><th>上传时间</th><th>操作</th></tr>
            </thead>
            <tbody id="docTableBody"></tbody>
          </table>
        </section>

        <!-- 召回测试页 -->
        <section class="tab-panel hidden" id="panel-hit">
          <div class="hit-form">
            <input type="text" id="hitQuery" placeholder="输入测试问题，例如：产品的退货政策是什么？" />
            <label>TopK <input type="number" id="hitTopK" value="4" min="1" max="20" /></label>
            <label>阈值 <input type="number" id="hitThreshold" value="0" min="0" max="1" step="0.05" /></label>
            <button class="btn btn-primary" id="btnHitTest">测试</button>
          </div>
          <div id="hitResults"></div>
        </section>

        <!-- 设置页 -->
        <section class="tab-panel hidden" id="panel-settings">
          <div class="form-card">
            <label>名称 <input type="text" id="setName" /></label>
            <label>描述 <textarea id="setDesc" rows="3"></textarea></label>
            <label>分段长度 <input type="number" id="setChunkSize" min="50" max="4000" /></label>
            <label>分段重叠 <input type="number" id="setChunkOverlap" min="0" max="500" /></label>
            <p class="muted">分段参数只影响之后上传的文档；已有文档可单独「重新索引」。</p>
            <div class="form-actions">
              <button class="btn btn-primary" id="btnSaveSettings">保存</button>
              <button class="btn btn-danger" id="btnDeleteDataset">删除知识库</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 分段管理弹窗 -->
  <div class="modal-mask hidden" id="segmentModal">
    <div class="modal">
      <header class="modal-header">
        <h2 id="segModalTitle">分段管理</h2>
        <button class="btn-icon" id="btnCloseSegModal">✕</button>
      </header>
      <div class="toolbar">
        <button class="btn btn-primary" id="btnAddSegment">+ 新增分段</button>
      </div>
      <div class="segment-list" id="segmentList"></div>
    </div>
  </div>

  <!-- 文档原文弹窗 -->
  <div class="modal-mask hidden" id="docContentModal">
    <div class="modal">
      <header class="modal-header">
        <h2 id="docContentTitle">文档原文</h2>
        <div>
          <a class="btn btn-sm" id="docDownloadLink" href="#">⬇ 下载原始文件</a>
          <button class="btn-icon" id="btnCloseDocModal">✕</button>
        </div>
      </header>
      <div class="doc-meta muted" id="docContentMeta"></div>
      <pre class="doc-content" id="docContentBody">加载中…</pre>
    </div>
  </div>

  <!-- 新建知识库弹窗 -->
  <div class="modal-mask hidden" id="datasetModal">
    <div class="modal modal-sm">
      <header class="modal-header">
        <h2>新建知识库</h2>
        <button class="btn-icon" id="btnCloseDsModal">✕</button>
      </header>
      <div class="form-card">
        <label>名称 <input type="text" id="newDsName" placeholder="例如：产品手册" /></label>
        <label>描述 <textarea id="newDsDesc" rows="2" placeholder="可选"></textarea></label>
        <label>分段长度 <input type="number" id="newDsChunkSize" value="500" min="50" max="4000" /></label>
        <label>分段重叠 <input type="number" id="newDsChunkOverlap" value="50" min="0" max="500" /></label>
        <div class="form-actions">
          <button class="btn btn-primary" id="btnCreateDataset">创建</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="/static/app.js?v=0.2.0"></script>
</body>
</html>
